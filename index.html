<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/sianlogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FEFEFF" />
    <title>Sian</title>
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fefeff;
        transition: opacity 0.25s ease;
      }
      #app-boot img { width: 56px; height: 56px; opacity: 0.9; }
      #app-boot.app-boot-hide { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #0b0b0f; }
      }
    </style>
  </head>
  <body>
    <div id="app-boot">
      <img src="/logos/sianlogo.svg" alt="Sian" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
